customers:
  age_bins: [0, 19, 29, 39, 49, 59, 120]
  age_labels: ["16-19", "20s", "30s", "40s", "50s", "60+"]
  unknown_label: Unknown
  subscribed_frequencies: [Regularly, Monthly]
  drop_columns: [postal_code, FN, fashion_news_frequency]

split:
  test_weeks: 1
  valid_weeks: 1
