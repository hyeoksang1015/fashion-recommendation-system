paths:
  raw_dir: data/raw
  articles_file: articles.csv
  customers_file: customers.csv
  transactions_file: transactions_train.csv
  image_dir: data/raw/images
  processed_dir: data/processed

load:
  transactions_nrows: null   # 개발 중 빠른 확인용. null이면 전체. 설정 시 dry run(저장 안 함)

articles:
  excluded_product_groups:
    - Items
    - Furniture
    - Garment and Shoe care
    - Stationery
    - Interior textile
    - Fun
    - Cosmetic
    # Unknown 그룹은 유지: test 주 거래의 약 1.5%이고 최근 주에 늘어 지우면 평가셋이 왜곡됨

  non_fashion_types:
    - Washing bag
    - Sewing kit
    - Stain remover spray
    - Clothing mist
    - Wood balls
    - Zipper head
    - Marker pen
    - Side table
    - Soft Toys
    - Waterbottle
    - Giftbox
    - Dog Wear
    - Umbrella
    - Sleeping sack
    - Sleep Bag
    - Baby Bib
    - Nipple covers
    - Bra extender

  type_merge_mapping:
    # 표기 불일치
    Earrings: Earring
    Flat shoes: Flat shoe
    Cap: Cap/peaked
    # 헤어 액세서리
    Alice band: Hair/alice band
    Hairband: Hair/alice band
    Headband: Hair/alice band
    # 가방류
    Backpack: Bag
    Cross-body bag: Bag
    Tote bag: Bag
    Shoulder bag: Bag
    Weekend/Gym bag: Bag
    Bumbag: Bag
    # 모자류
    Felt hat: Hat/beanie
    Bucket hat: Hat/beanie
    Straw hat: Hat/beanie

  min_type_count: 50
  rare_type_prefix: "Other_"

  # garment_group_name == "Unknown" 인 행에만 적용. key: product_type_name
  garment_group_mapping:
    T-shirt: Jersey Basic
    Vest top: Jersey Basic
    Top: Jersey Fancy
    Polo shirt: Jersey Fancy
    Shirt: Shirts
    Blouse: Blouses
    Bodysuit: Jersey Basic
    Garment Set: Dressed
    Sweater: Knitwear
    Cardigan: Knitwear
